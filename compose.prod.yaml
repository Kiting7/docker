# Simulation de production en local :
# docker compose -f compose.yaml -f compose.prod.yaml up -d --build

services:
  db:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      target: production
    image: ${IMAGE_PREFIX:-docker-eval}-backend:${APP_VERSION:-1.0.0}
    environment:
      NODE_ENV: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # Aucun port publié pour le backend.
    # L'accès HTTP passe par le frontend Nginx.

  frontend:
    build:
      target: production
    image: ${IMAGE_PREFIX:-docker-eval}-frontend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s